[build]
  publish = "."
  # Pages are pre-generated and committed: run `python build/build.py` after editing build/roles_data.py or index.html

[functions]
  node_bundler = "esbuild"

# ===== Blog & API redirects =====
[[redirects]]
  from = "/api/articles-webhook"
  to = "/.netlify/functions/articles-webhook"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/blog-post"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/dynamic-sitemap"
  status = 200
  force = true

# Old role pages → new roles (301 permanent)
[[redirects]]
  from = "/roles/cad-drafter/*"
  to = "/roles/drafter/"
  status = 301

[[redirects]]
  from = "/roles/bim-modeler/*"
  to = "/roles/drafter/"
  status = 301

[[redirects]]
  from = "/roles/3d-visualization-artist/*"
  to = "/roles/architectural-designer/"
  status = 301

[[redirects]]
  from = "/roles/permit-coordinator/*"
  to = "/#roles"
  status = 301

[[redirects]]
  from = "/roles/construction-admin-support/*"
  to = "/roles/administrative-assistant/"
  status = 301

[[redirects]]
  from = "/roles/marketing-coordinator/*"
  to = "/#roles"
  status = 301

[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
